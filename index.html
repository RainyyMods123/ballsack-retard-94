<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 APK Modding Server - File Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0b0f;
            color: #d4dcec;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #13161f;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #252b3a;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #252b3a;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .badge {
            background: #1e2a3a;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #8a9bb5;
            border: 1px solid #2a3a4a;
        }

        .header .badge span {
            color: #f0c27f;
            font-weight: 600;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            background: #1a1d27;
            padding: 15px 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid #252b3a;
        }

        .stats div {
            font-size: 0.95rem;
        }

        .stats strong {
            color: #b7c0d0;
            font-weight: 600;
        }

        .stats .num {
            color: #f0c27f;
            font-weight: 700;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed #2a3a4a;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #0d1018;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #f7971e;
            background: #111620;
        }

        .upload-area.dragover {
            border-color: #ffd200;
            background: #1a1f2a;
            transform: scale(1.01);
        }

        .upload-area .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #8a9bb5;
            font-size: 1.1rem;
        }

        .upload-area .sub {
            color: #4a5268;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        #fileInput {
            display: none;
        }

        /* Search/Filter */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }

        .controls input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 12px 18px;
            border-radius: 30px;
            border: 1px solid #252b3a;
            background: #0d1018;
            color: #d4dcec;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .controls input[type="text"]:focus {
            border-color: #f7971e;
            box-shadow: 0 0 15px rgba(247, 151, 30, 0.1);
        }

        .controls .btn {
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            background: #f7971e;
            color: #0a0b0f;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .controls .btn:hover {
            background: #ffd200;
            transform: scale(1.02);
        }

        .controls .btn.danger {
            background: #6b2a2a;
            color: #df7d7d;
        }

        .controls .btn.danger:hover {
            background: #8a2a2a;
        }

        /* File List */
        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .file-item {
            background: #1a1d27;
            border-radius: 14px;
            padding: 18px;
            border: 1px solid #252b3a;
            transition: 0.3s;
            position: relative;
        }

        .file-item:hover {
            border-color: #3a4a5a;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .file-item .name {
            font-weight: 600;
            color: #d4dcec;
            word-break: break-word;
            font-size: 0.95rem;
        }

        .file-item .meta {
            font-size: 0.8rem;
            color: #6a7a8a;
            margin: 6px 0 10px 0;
        }

        .file-item .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .file-item .actions a,
        .file-item .actions button {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .file-item .actions .download {
            background: #1e3a2a;
            color: #7ddfa0;
        }

        .file-item .actions .download:hover {
            background: #2a6b3f;
        }

        .file-item .actions .delete {
            background: #3a1e1e;
            color: #df7d7d;
        }

        .file-item .actions .delete:hover {
            background: #6b2a2a;
        }

        .file-item .file-icon {
            font-size: 1.8rem;
            margin-right: 10px;
        }

        .file-item .size-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #0d1018;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #6a7a8a;
            border: 1px solid #1a2a3a;
        }

        .empty {
            text-align: center;
            color: #4a5268;
            padding: 60px 20px;
            font-size: 1.1rem;
        }

        /* Footer Credit */
        .footer-credit {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #1a1d27;
            text-align: center;
            font-size: 0.75rem;
            color: #3a4258;
            letter-spacing: 0.5px;
        }

        .footer-credit a {
            color: #5a6a8a;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer-credit a:hover {
            color: #f7971e;
            text-decoration: underline;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1d27;
            padding: 16px 28px;
            border-radius: 14px;
            border-left: 4px solid #f7971e;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            color: #d4dcec;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.4s ease;
            z-index: 999;
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left-color: #7ddfa0;
        }

        .toast.error {
            border-left-color: #df7d7d;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .stats {
                flex-direction: column;
                gap: 8px;
            }
            .controls {
                flex-direction: column;
            }
            .controls input[type="text"] {
                width: 100%;
            }
            .file-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>🔧 APK Modding Server</h1>
        <div class="badge">
            📦 <span id="fileCount">0</span> files • 💾 <span id="totalSize">0 MB</span>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div><strong>📱 Modded APKs</strong> <span class="num" id="apkCount">0</span></div>
        <div><strong>📄 Other Files</strong> <span class="num" id="otherCount">0</span></div>
        <div><strong>📁 Total Storage</strong> <span class="num" id="storageUsed">0 MB</span></div>
    </div>

    <!-- Upload Area -->
    <div class="upload-area" id="dropZone">
        <div class="icon">📤</div>
        <p><strong>Drop your modded APK here</strong></p>
        <p class="sub">or click to browse • Max 500MB per file</p>
        <input type="file" id="fileInput" multiple>
    </div>

    <!-- Controls -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍 Search files...">
        <button class="btn" id="refreshBtn">🔄 Refresh</button>
        <button class="btn danger" id="clearAllBtn">🗑️ Clear All</button>
    </div>

    <!-- File List -->
    <div id="fileListContainer">
        <div class="empty">📂 No files uploaded yet. Drop your modded APKs above!</div>
    </div>

    <!-- Footer Credit -->
    <div class="footer-credit">
        AMH is founded by Rainyy .gg/Rfm9ZnfNX5
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    (function() {
        // ============================================================
        // STORAGE: Uses localStorage to persist file data
        // ============================================================
        const STORAGE_KEY = 'modding_server_files';

        function getFiles() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch {
                return [];
            }
        }

        function saveFiles(files) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(2) + ' MB';
        }

        function generateId() {
            return Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function isApk(filename) {
            return filename.toLowerCase().endsWith('.apk');
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // RENDER FILE LIST
        // ============================================================
        function renderFiles(searchTerm = '') {
            const files = getFiles();
            const container = document.getElementById('fileListContainer');
            const search = searchTerm.toLowerCase().trim();

            let filtered = files;
            if (search) {
                filtered = files.filter(f => f.name.toLowerCase().includes(search));
            }

            // Update stats
            const apkCount = files.filter(f => isApk(f.name)).length;
            const otherCount = files.length - apkCount;
            const totalBytes = files.reduce((sum, f) => sum + f.size, 0);

            document.getElementById('fileCount').textContent = files.length;
            document.getElementById('totalSize').textContent = formatSize(totalBytes);
            document.getElementById('apkCount').textContent = apkCount;
            document.getElementById('otherCount').textContent = otherCount;
            document.getElementById('storageUsed').textContent = formatSize(totalBytes);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty">${search ? '🔍 No results found' : '📂 No files uploaded yet. Drop your modded APKs above!'}</div>`;
                return;
            }

            let html = '<div class="file-list">';
            filtered.forEach((file, index) => {
                const icon = isApk(file.name) ? '📱' : '📄';
                const sizeStr = formatSize(file.size);
                const dateStr = new Date(file.uploaded).toLocaleDateString();
                html += `
                    <div class="file-item" data-index="${index}">
                        <span class="size-badge">${sizeStr}</span>
                        <div>
                            <span class="file-icon">${icon}</span>
                            <span class="name">${file.name}</span>
                        </div>
                        <div class="meta">📅 ${dateStr} • ${isApk(file.name) ? 'APK' : 'File'}</div>
                        <div class="actions">
                            <a href="${file.dataUrl}" download="${file.name}" class="download">⬇️ Download</a>
                            <button class="delete" data-id="${file.id}">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;

            // Attach delete events
            container.querySelectorAll('.delete').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const id = this.dataset.id;
                    deleteFile(id);
                });
            });
        }

        // ============================================================
        // CRUD OPERATIONS
        // ============================================================
        function addFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const files = getFiles();
                    const newFile = {
                        id: generateId(),
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        uploaded: Date.now(),
                        dataUrl: e.target.result
                    };
                    files.push(newFile);
                    saveFiles(files);
                    renderFiles(document.getElementById('searchInput').value);
                    showToast(`✅ Uploaded: ${file.name}`, 'success');
                    resolve();
                };
                reader.onerror = function() {
                    reject('Failed to read file');
                };
                reader.readAsDataURL(file);
            });
        }

        function deleteFile(id) {
            if (!confirm('Delete this file?')) return;
            let files = getFiles();
            const file = files.find(f => f.id === id);
            files = files.filter(f => f.id !== id);
            saveFiles(files);
            renderFiles(document.getElementById('searchInput').value);
            if (file) showToast(`🗑️ Deleted: ${file.name}`, 'error');
        }

        function clearAllFiles() {
            if (!confirm('⚠️ Delete ALL files? This cannot be undone!')) return;
            saveFiles([]);
            renderFiles('');
            showToast('🗑️ All files cleared', 'error');
        }

        // ============================================================
        // UPLOAD HANDLING
        // ============================================================
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                handleFiles(this.files);
                this.value = '';
            }
        });

        async function handleFiles(fileList) {
            const maxSize = 500 * 1024 * 1024; // 500MB
            let successCount = 0;

            for (let file of fileList) {
                if (file.size > maxSize) {
                    showToast(`❌ ${file.name} is too large (max 500MB)`, 'error');
                    continue;
                }
                try {
                    await addFile(file);
                    successCount++;
                } catch (err) {
                    showToast(`❌ Failed: ${file.name}`, 'error');
                }
            }

            if (successCount > 0) {
                renderFiles(document.getElementById('searchInput').value);
            }
        }

        // ============================================================
        // SEARCH
        // ============================================================
        document.getElementById('searchInput').addEventListener('input', function() {
            renderFiles(this.value);
        });

        // ============================================================
        // REFRESH / CLEAR
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            renderFiles(document.getElementById('searchInput').value);
            showToast('🔄 Refreshed', 'info');
        });

        document.getElementById('clearAllBtn').addEventListener('click', clearAllFiles);

        // ============================================================
        // INIT
        // ============================================================
        renderFiles('');

        // If localStorage is empty, add some example files for demo
        const existing = getFiles();
        if (existing.length === 0) {
            // Optionally pre-populate with nothing - users will upload
            // Uncomment below to add example entries
            /*
            const examples = [
                { id: generateId(), name: 'Example_Mod_v2.3.apk', size: 45678912, type: 'application/vnd.android.package-archive', uploaded: Date.now() - 86400000, dataUrl: '#' },
                { id: generateId(), name: 'Game_Mod_Unlimited.apk', size: 123456789, type: 'application/vnd.android.package-archive', uploaded: Date.now() - 172800000, dataUrl: '#' }
            ];
            saveFiles(examples);
            renderFiles('');
            */
        }

        console.log('🔧 APK Modding Server loaded');
        console.log('📁 Files stored in localStorage');
        console.log('💡 Upload APKs to share with your modding community');
    })();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📢 Community & Official Posts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0b0f;
            color: #d4dcec;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #13161f;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #252b3a;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #252b3a;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .badge {
            background: #1e2a3a;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #8a9bb5;
            border: 1px solid #2a3a4a;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 25px;
            background: #0d1018;
            border-radius: 14px;
            padding: 5px;
            border: 1px solid #1a1d27;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            background: transparent;
            color: #6a7a8a;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s;
            text-align: center;
        }

        .tab-btn:hover {
            color: #d4dcec;
            background: #1a1d27;
        }

        .tab-btn.active {
            background: #f7971e;
            color: #0a0b0f;
        }

        .tab-btn .count {
            background: #1a1d27;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        .tab-btn.active .count {
            background: #0a0b0f;
            color: #f7971e;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Create Post */
        .create-post {
            background: #1a1d27;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #252b3a;
            margin-bottom: 25px;
        }

        .create-post h3 {
            margin-bottom: 15px;
            color: #b7c0d0;
            font-weight: 500;
        }

        .create-post input,
        .create-post textarea,
        .create-post select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #252b3a;
            background: #0d1018;
            color: #d4dcec;
            font-size: 0.95rem;
            margin-bottom: 12px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }

        .create-post input:focus,
        .create-post textarea:focus,
        .create-post select:focus {
            border-color: #f7971e;
            box-shadow: 0 0 15px rgba(247, 151, 30, 0.1);
        }

        .create-post textarea {
            min-height: 100px;
            resize: vertical;
        }

        .create-post .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .create-post .btn {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: #f7971e;
            color: #0a0b0f;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .create-post .btn:hover {
            background: #ffd200;
            transform: scale(1.02);
        }

        .create-post .btn.secondary {
            background: #1e2a3a;
            color: #8a9bb5;
        }

        .create-post .btn.secondary:hover {
            background: #2a3a4a;
        }

        /* Posts List */
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .post-item {
            background: #1a1d27;
            border-radius: 14px;
            padding: 20px;
            border: 1px solid #252b3a;
            transition: 0.3s;
        }

        .post-item:hover {
            border-color: #3a4a5a;
        }

        .post-item.official {
            border-left: 4px solid #f7971e;
            background: #1a1a1a;
        }

        .post-item.community {
            border-left: 4px solid #4a7a9a;
        }

        .post-item .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .post-item .post-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #d4dcec;
        }

        .post-item .post-author {
            font-size: 0.85rem;
            color: #6a7a8a;
        }

        .post-item .post-author .official-badge {
            background: #f7971e;
            color: #0a0b0f;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 8px;
        }

        .post-item .post-author .community-badge {
            background: #4a7a9a;
            color: #fff;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 8px;
        }

        .post-item .post-content {
            color: #b7c0d0;
            line-height: 1.6;
            margin: 10px 0;
            word-break: break-word;
        }

        .post-item .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1a1d27;
        }

        .post-item .post-date {
            font-size: 0.75rem;
            color: #4a5268;
        }

        .post-item .delete-btn {
            background: #3a1e1e;
            color: #df7d7d;
            border: none;
            padding: 4px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.3s;
        }

        .post-item .delete-btn:hover {
            background: #6b2a2a;
        }

        .empty {
            text-align: center;
            color: #4a5268;
            padding: 60px 20px;
            font-size: 1.1rem;
        }

        /* Footer Credit */
        .footer-credit {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #1a1d27;
            text-align: center;
            font-size: 0.75rem;
            color: #3a4258;
            letter-spacing: 0.5px;
        }

        .footer-credit a {
            color: #5a6a8a;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer-credit a:hover {
            color: #f7971e;
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1d27;
            padding: 16px 28px;
            border-radius: 14px;
            border-left: 4px solid #f7971e;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            color: #d4dcec;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.4s ease;
            z-index: 999;
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left-color: #7ddfa0;
        }

        .toast.error {
            border-left-color: #df7d7d;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .tabs {
                flex-direction: column;
            }
            .tab-btn {
                padding: 10px;
            }
            .create-post .btn-row {
                flex-direction: column;
            }
            .create-post .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>📢 Posts</h1>
        <div class="badge">
            📝 <span id="totalPosts">0</span> total posts
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="official">
            🏛️ Official
            <span class="count" id="officialCount">0</span>
        </button>
        <button class="tab-btn" data-tab="community">
            👥 Community
            <span class="count" id="communityCount">0</span>
        </button>
    </div>

    <!-- Official Tab -->
    <div class="tab-content active" id="tab-official">
        <div class="create-post">
            <h3>📝 Create Official Post</h3>
            <input type="text" id="officialTitle" placeholder="Post title..." maxlength="100">
            <textarea id="officialContent" placeholder="Post content..."></textarea>
            <input type="text" id="officialAuthor" placeholder="Your name/username..." maxlength="50">
            <div class="btn-row">
                <button class="btn" id="postOfficialBtn">📤 Post Official</button>
                <button class="btn secondary" id="clearOfficialBtn">Clear</button>
            </div>
        </div>
        <div class="posts-list" id="officialPosts"></div>
    </div>

    <!-- Community Tab -->
    <div class="tab-content" id="tab-community">
        <div class="create-post">
            <h3>📝 Create Community Post</h3>
            <input type="text" id="communityTitle" placeholder="Post title..." maxlength="100">
            <textarea id="communityContent" placeholder="Post content..."></textarea>
            <input type="text" id="communityAuthor" placeholder="Your name/username..." maxlength="50">
            <div class="btn-row">
                <button class="btn" id="postCommunityBtn">📤 Post to Community</button>
                <button class="btn secondary" id="clearCommunityBtn">Clear</button>
            </div>
        </div>
        <div class="posts-list" id="communityPosts"></div>
    </div>

    <!-- Footer Credit -->
    <div class="footer-credit">
        AMH is founded by Rainyy .gg/Rfm9ZnfNX5
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    (function() {
        // ============================================================
        // STORAGE
        // ============================================================
        const STORAGE_KEY = 'community_posts_data';

        function getPosts() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch {
                return [];
            }
        }

        function savePosts(posts) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function generateId() {
            return Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderPosts() {
            const posts = getPosts();
            const officialPosts = posts.filter(p => p.category === 'official');
            const communityPosts = posts.filter(p => p.category === 'community');

            // Update counts
            document.getElementById('totalPosts').textContent = posts.length;
            document.getElementById('officialCount').textContent = officialPosts.length;
            document.getElementById('communityCount').textContent = communityPosts.length;

            // Render Official
            renderPostList('officialPosts', officialPosts, 'official');
            renderPostList('communityPosts', communityPosts, 'community');
        }

        function renderPostList(containerId, posts, category) {
            const container = document.getElementById(containerId);
            
            if (posts.length === 0) {
                container.innerHTML = `<div class="empty">📭 No ${category} posts yet. Create one above!</div>`;
                return;
            }

            let html = '';
            // Sort by newest first
            const sorted = [...posts].sort((a, b) => b.timestamp - a.timestamp);
            
            sorted.forEach(post => {
                const badge = category === 'official' 
                    ? '<span class="official-badge">OFFICIAL</span>'
                    : '<span class="community-badge">COMMUNITY</span>';
                
                html += `
                    <div class="post-item ${category}">
                        <div class="post-header">
                            <div class="post-title">${escapeHtml(post.title)}</div>
                        </div>
                        <div class="post-author">
                            👤 ${escapeHtml(post.author)} ${badge}
                        </div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        <div class="post-meta">
                            <div class="post-date">📅 ${formatDate(post.timestamp)}</div>
                            <button class="delete-btn" data-id="${post.id}">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // Attach delete events
            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    deletePost(id);
                });
            });
        }

        // Simple escape to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // CRUD
        // ============================================================
        function addPost(title, content, author, category) {
            if (!title.trim() || !content.trim() || !author.trim()) {
                showToast('❌ Please fill in all fields', 'error');
                return false;
            }

            const posts = getPosts();
            const newPost = {
                id: generateId(),
                title: title.trim(),
                content: content.trim(),
                author: author.trim(),
                category: category, // 'official' or 'community'
                timestamp: Date.now()
            };

            posts.push(newPost);
            savePosts(posts);
            renderPosts();

            const categoryName = category === 'official' ? 'Official' : 'Community';
            showToast(`✅ ${categoryName} post created: ${title.trim()}`, 'success');
            return true;
        }

        function deletePost(id) {
            if (!confirm('Delete this post?')) return;
            let posts = getPosts();
            const post = posts.find(p => p.id === id);
            posts = posts.filter(p => p.id !== id);
            savePosts(posts);
            renderPosts();
            if (post) showToast(`🗑️ Deleted: ${post.title}`, 'error');
        }

        function clearAllPosts() {
            if (!confirm('⚠️ Delete ALL posts? This cannot be undone!')) return;
            savePosts([]);
            renderPosts();
            showToast('🗑️ All posts cleared', 'error');
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = {
            official: document.getElementById('tab-official'),
            community: document.getElementById('tab-community')
        };

        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active from all
                tabBtns.forEach(b => b.classList.remove('active'));
                Object.values(tabContents).forEach(tc => tc.classList.remove('active'));

                // Add active to clicked
                this.classList.add('active');
                const tab = this.dataset.tab;
                tabContents[tab].classList.add('active');
            });
        });

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        // Official Post
        document.getElementById('postOfficialBtn').addEventListener('click', function() {
            const title = document.getElementById('officialTitle').value;
            const content = document.getElementById('officialContent').value;
            const author = document.getElementById('officialAuthor').value;
            if (addPost(title, content, author, 'official')) {
                document.getElementById('officialTitle').value = '';
                document.getElementById('officialContent').value = '';
                document.getElementById('officialAuthor').value = '';
            }
        });

        // Community Post
        document.getElementById('postCommunityBtn').addEventListener('click', function() {
            const title = document.getElementById('communityTitle').value;
            const content = document.getElementById('communityContent').value;
            const author = document.getElementById('communityAuthor').value;
            if (addPost(title, content, author, 'community')) {
                document.getElementById('communityTitle').value = '';
                document.getElementById('communityContent').value = '';
                document.getElementById('communityAuthor').value = '';
            }
        });

        // Clear buttons
        document.getElementById('clearOfficialBtn').addEventListener('click', function() {
            document.getElementById('officialTitle').value = '';
            document.getElementById('officialContent').value = '';
            document.getElementById('officialAuthor').value = '';
        });

        document.getElementById('clearCommunityBtn').addEventListener('click', function() {
            document.getElementById('communityTitle').value = '';
            document.getElementById('communityContent').value = '';
            document.getElementById('communityAuthor').value = '';
        });

        // ============================================================
        // INIT
        // ============================================================
        renderPosts();

        // Add some example posts if empty
        const existing = getPosts();
        if (existing.length === 0) {
            const examples = [
                {
                    id: generateId(),
                    title: 'Welcome to the Modding Server!',
                    content: 'This is the official announcement post. Please read the rules before posting.',
                    author: 'Admin',
                    category: 'official',
                    timestamp: Date.now() - 3600000
                },
                {
                    id: generateId(),
                    title: 'New Mod Release: Game X v2.0',
                    content: 'Just uploaded the new mod for Game X. Check the modding channel for download links!',
                    author: 'ModMaster',
                    category: 'community',
                    timestamp: Date.now() - 7200000
                }
            ];
            savePosts(examples);
            renderPosts();
        }

        console.log('📢 Posts system loaded');
        console.log('📁 Posts stored in localStorage');
    })();
</script>

</body>
</html>

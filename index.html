<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainyy · g's</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* ─── Reset & Base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            font-family: 'Share Tech Mono', monospace;
            padding: 1.5rem;
            background-image:
                linear-gradient(rgba(255, 0, 85, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 85, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            position: relative;
        }

        /* scanline overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.15) 0px,
                    rgba(0, 0, 0, 0.15) 2px,
                    transparent 2px,
                    transparent 6px);
            pointer-events: none;
            z-index: 10;
        }

        /* ─── Main Card ─── */
        .container {
            max-width: 780px;
            width: 100%;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 0, 85, 0.25);
            box-shadow: 0 0 60px rgba(255, 0, 85, 0.15), inset 0 0 60px rgba(255, 0, 85, 0.03);
            padding: 3rem 2.5rem;
            border-radius: 28px;
            text-align: center;
            position: relative;
            z-index: 5;
            transition: box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 0 80px rgba(255, 0, 85, 0.25), inset 0 0 80px rgba(255, 0, 85, 0.05);
        }

        /* ─── Header: RAINYY + g's ─── */
        .header {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 1.5rem;
        }

        .main-link {
            text-decoration: none;
            display: inline-block;
            position: relative;
            transition: transform 0.2s ease;
        }
        .main-link:hover {
            transform: scale(1.03);
        }
        .main-link:active {
            transform: scale(0.97);
        }

        .federal {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(3.8rem, 15vw, 5.8rem);
            letter-spacing: 0.12em;
            background: linear-gradient(135deg, #ff0055, #ff3366);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 85, 0.4), 0 0 60px rgba(255, 0, 85, 0.15);
            line-height: 1;
            position: relative;
            cursor: pointer;
        }

        .federal::before {
            content: 'RAINYY';
            position: absolute;
            top: 0;
            left: -2px;
            color: #00f0ff;
            opacity: 0.3;
            z-index: -1;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translateX(-3px);
        }
        .federal::after {
            content: 'RAINYY';
            position: absolute;
            top: 0;
            left: 2px;
            color: #ffcc00;
            opacity: 0.2;
            z-index: -1;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            transform: translateX(3px);
        }

        .gs {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            color: #c0c0d0;
            letter-spacing: 0.3em;
            text-shadow: 0 0 20px rgba(192, 192, 208, 0.2);
            padding-left: 0.2rem;
        }

        /* ─── Names ─── */
        .names {
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            color: #e0e0f0;
            letter-spacing: 0.04em;
            margin-bottom: 0.6rem;
            line-height: 1.7;
        }

        .names span {
            font-weight: 700;
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
            transition: color 0.2s;
        }

        .names span:hover {
            color: #ffcc00;
        }

        .names .slash {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
            margin: 0 0.1rem;
        }

        .second-line {
            margin-bottom: 1.8rem;
        }
        .second-line span {
            color: #ff7b9c;
            text-shadow: 0 0 20px rgba(255, 123, 156, 0.2);
        }

        /* ─── AKA ─── */
        .aka {
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            color: #b0b0c8;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }

        .aka span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #ffcc00;
            text-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
            background: rgba(255, 204, 0, 0.06);
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 204, 0, 0.15);
            display: inline-block;
            margin-top: 0.2rem;
        }

        /* ─── Discord Handle ─── */
        .discord-handle {
            font-size: clamp(1rem, 2.2vw, 1.3rem);
            color: #b8b8d0;
            margin-bottom: 2rem;
            padding: 0.4rem 1rem;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.02);
        }

        .discord-handle span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #5865F2;
            text-shadow: 0 0 30px rgba(88, 101, 242, 0.3);
            letter-spacing: 0.05em;
        }

        /* ─── Buttons / Links ─── */
        .links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.2rem 1.8rem;
            margin-bottom: 2rem;
        }

        .btn-discord {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(0.9rem, 1.8vw, 1.1rem);
            background: linear-gradient(135deg, #5865F2, #4752c4);
            color: #fff;
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            text-decoration: none;
            letter-spacing: 0.08em;
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-discord:hover {
            transform: scale(1.04);
            box-shadow: 0 0 50px rgba(88, 101, 242, 0.45);
            background: linear-gradient(135deg, #6c7af5, #5865F2);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn-discord::before {
            content: '▶';
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .telegram {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: clamp(0.8rem, 1.6vw, 1rem);
            color: #7a7a9a;
            letter-spacing: 0.15em;
            padding: 0.5rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.2s;
            cursor: default;
        }

        .telegram:hover {
            color: #26A5E4;
            border-color: rgba(38, 165, 228, 0.2);
            background: rgba(38, 165, 228, 0.04);
        }

        /* ─── Sound Button (song player) ─── */
        .btn-sound {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(0.8rem, 1.6vw, 1rem);
            background: linear-gradient(135deg, #00c8b0, #009688);
            color: #fff;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 60px;
            letter-spacing: 0.08em;
            box-shadow: 0 0 30px rgba(0, 200, 176, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.25s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-sound:hover {
            transform: scale(1.04);
            box-shadow: 0 0 50px rgba(0, 200, 176, 0.4);
            background: linear-gradient(135deg, #00e6cc, #00b8a0);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn-sound.playing {
            background: linear-gradient(135deg, #ff8a00, #e65c00);
            box-shadow: 0 0 40px rgba(255, 138, 0, 0.4);
        }
        .btn-sound.playing:hover {
            background: linear-gradient(135deg, #ffa033, #ff6a00);
            box-shadow: 0 0 60px rgba(255, 138, 0, 0.6);
        }

        /* ─── Invite Link ─── */
        .invite-link {
            margin-top: 0.5rem;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .invite-link a {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(0.75rem, 1.6vw, 0.95rem);
            color: #6a6a8a;
            text-decoration: none;
            letter-spacing: 0.06em;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            word-break: break-all;
        }

        .invite-link a:hover {
            color: #00f0ff;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }

        /* ─── Responsive ─── */
        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.2rem;
                border-radius: 20px;
            }
            .header {
                gap: 0.1rem;
                margin-bottom: 1.5rem;
            }
            .federal::before,
            .federal::after {
                display: none;
            }
            .names {
                font-size: 1rem;
            }
            .links {
                flex-direction: column;
                gap: 0.8rem;
            }
            .btn-discord,
            .btn-sound {
                width: 100%;
                justify-content: center;
            }
            .telegram {
                width: 100%;
                text-align: center;
            }
        }

        @keyframes borderPulse {
            0% { border-color: rgba(255, 0, 85, 0.2); }
            50% { border-color: rgba(255, 0, 85, 0.4); }
            100% { border-color: rgba(255, 0, 85, 0.2); }
        }
        .container {
            animation: borderPulse 4s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- RAINYY + g's (clickable to main page) -->
        <div class="header">
            <a href="main.html" class="main-link" title="Go to main page">
                <span class="federal">RAINYY</span>
            </a>
            <span class="gs">g's</span>
        </div>

        <!-- Names -->
        <div class="names">
            <span>Vice</span><span class="slash"> / </span>
            <span>Rebortion</span><span class="slash"> / </span>
            <span>Virus</span><span class="slash"> / </span>
        </div>
        <div class="names second-line">
            <span>Tr4gic</span><span class="slash"> / </span>
            <span>Sunny</span><span class="slash"> / </span>
            <span>Navy</span>
        </div>

        <!-- AKA -->
        <div class="aka">
            AKA <span>Prototype</span>
        </div>

        <!-- Discord Handle -->
        <div class="discord-handle">
            discord is: <span>f0deral</span>
        </div>

        <!-- Action Buttons -->
        <div class="links">
            <a href="https://discord.gg/Rfm9ZnfNX5" target="_blank" class="btn-discord">
                Discord Server
            </a>
            <span class="telegram">Telegram</span>
            <button id="soundToggle" class="btn-sound">♫ PAUSED</button>
        </div>

        <!-- Invite URL -->
        <div class="invite-link">
            <a href="https://discord.gg/vRr8jgraW6" target="_blank">
                https://discord.gg/vRr8jgraW6
            </a>
        </div>

    </div>

    <script>
        (function() {
            // ─── CHANGE THIS TO YOUR SONG FILE ───
            const songFile = 'your-song.mp3';  // <-- put your MP3/WAV filename here

            // Create the audio player
            const audio = new Audio(songFile);
            audio.loop = true;          // keep repeating
            audio.volume = 0.7;         // 0.0 to 1.0

            const soundBtn = document.getElementById('soundToggle');
            let isPlaying = false;

            function toggleSong() {
                if (isPlaying) {
                    audio.pause();
                    soundBtn.textContent = '♫ PAUSED';
                    soundBtn.classList.remove('playing');
                    isPlaying = false;
                } else {
                    // Resume if paused, or start fresh
                    audio.play().catch(err => {
                        // Auto-play blocked by browser? Show a hint.
                        alert('Click again to play – browser requires a user gesture.');
                        console.warn('Playback failed:', err);
                    });
                    soundBtn.textContent = '♫ PLAYING';
                    soundBtn.classList.add('playing');
                    isPlaying = true;
                }
            }

            // Update button state when the song ends naturally (if not looping)
            audio.addEventListener('ended', () => {
                if (audio.loop) {
                    // if loop is true, it won't fire 'ended' – but just in case
                    return;
                }
                soundBtn.textContent = '♫ PAUSED';
                soundBtn.classList.remove('playing');
                isPlaying = false;
            });

            // Click to toggle
            soundBtn.addEventListener('click', toggleSong);

            // Optional: clean up if page is closed
            window.addEventListener('beforeunload', () => {
                audio.pause();
            });
        })();
    </script>
</body>
</html>
